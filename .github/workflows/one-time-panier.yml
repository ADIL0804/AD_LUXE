name: One-time Panier edit
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  edit:
    if: github.event.head_commit.message != 'chore: replace navbar WhatsApp with Panier'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace only the first navbar WhatsApp label
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '>WhatsApp</a>'
          new = '>🛒 Panier</a>'
          if old not in s:
              raise SystemExit('Target label not found; no change made.')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'chore: replace navbar WhatsApp with Panier'
          git push
