name: Optimize Product Images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimize-product-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Pillow
        run: python -m pip install --quiet Pillow

      - name: Convert heavy product images to WebP and create thumbnails
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          import re

          root = Path('assets/products')
          target_dirs = [
              root / 'sandales-elegance',
              root / 'parfumerie',
              root / 'sac-elegance-signature',
              root / 'sac-bandouliere-elegance',
              root / 'sac-trio-elegance',
          ]
          converted = {}

          def save_webp(src: Path, dst: Path):
              with Image.open(src) as im:
                  im = ImageOps.exif_transpose(im)
                  if max(im.size) > 1600:
                      im.thumbnail((1600, 1600), Image.Resampling.LANCZOS)
                  if im.mode not in ('RGB', 'RGBA'):
                      im = im.convert('RGBA' if 'A' in im.getbands() else 'RGB')
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  im.save(dst, 'WEBP', quality=82, method=6, exact=True)

          for d in target_dirs:
              if not d.exists():
                  continue
              for src in sorted(d.iterdir()):
                  if src.suffix.lower() not in {'.jpg', '.jpeg', '.png'}:
                      continue
                  dst = src.with_suffix('.webp')
                  save_webp(src, dst)
                  converted[src.as_posix()] = dst.as_posix()

          for src in root.rglob('*.webp'):
              if src.name.endswith('-thumb.webp'):
                  continue
              thumb = src.with_name(src.stem + '-thumb.webp')
              with Image.open(src) as im:
                  im = ImageOps.exif_transpose(im)
                  im.thumbnail((280, 280), Image.Resampling.LANCZOS)
                  if im.mode not in ('RGB', 'RGBA'):
                      im = im.convert('RGBA' if 'A' in im.getbands() else 'RGB')
                  im.save(thumb, 'WEBP', quality=72, method=6, exact=True)

          text_exts = {'.html', '.js', '.xml', '.css', '.json'}
          for path in Path('.').rglob('*'):
              if not path.is_file() or path.suffix.lower() not in text_exts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              original = text
              for old, new in converted.items():
                  text = text.replace(old, new)
                  text = text.replace('/' + old, '/' + new)
                  text = text.replace('https://ad-luxe.ma/' + old, 'https://ad-luxe.ma/' + new)
              if path.suffix.lower() == '.html':
                  text = re.sub(r'analytics\.js\?v=[0-9-]+', 'analytics.js?v=20260824-3', text)
              if text != original:
                  path.write_text(text, encoding='utf-8')

          loader = Path('analytics-core.js')
          if loader.exists():
              text = loader.read_text(encoding='utf-8')
              if 'function thumbSrc(src)' not in text:
                  marker = "  function uniqueColors(images) {\n    return [...new Set(images.map((item) => item.color))];\n  }\n"
                  helper = marker + "\n  function thumbSrc(src) {\n    return src.endsWith('.webp') ? src.replace(/\\.webp$/, '-thumb.webp') : src;\n  }\n"
                  text = text.replace(marker, helper)
              text = text.replace('<img src="${esc(item.src)}" alt="${esc(product.name)} — ${esc(item.color)}"', '<img src="${esc(thumbSrc(item.src))}" alt="${esc(product.name)} — ${esc(item.color)}"')
              loader.write_text(text, encoding='utf-8')

          facade = Path('analytics.js')
          if facade.exists():
              text = facade.read_text(encoding='utf-8')
              text = re.sub(r'analytics-core\.js\?v=[0-9-]+', 'analytics-core.js?v=20260824-3', text)
              text = re.sub(r'upgrade\.js\?v=[0-9-]+', 'upgrade.js?v=20260824-2', text)
              text = re.sub(r'seo-runtime\.js\?v=[0-9-]+', 'seo-runtime.js?v=20260824-3', text)
              facade.write_text(text, encoding='utf-8')

          print(f'Converted {len(converted)} heavy product images to WebP.')
          PY

      - name: Show image savings
        run: |
          echo 'Largest active optimized product images:'
          find assets/products -type f -name '*.webp' ! -name '*-thumb.webp' -printf '%s %p\n' | sort -nr | head -25
          echo 'Largest thumbnail files:'
          find assets/products -type f -name '*-thumb.webp' -printf '%s %p\n' | sort -nr | head -15

      - name: Commit optimized images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/products analytics-core.js analytics.js product-detail.js trio.js sitemap.xml products index.html legal.html instagram.html 404.html 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'No optimization changes to commit.'
            exit 0
          fi
          git commit -m 'Refresh optimized product assets'
          git push
