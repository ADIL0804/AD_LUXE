name: Clean obsolete Git branches (one time)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-obsolete-branches.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Keep main and history backup; delete stale branches
        uses: actions/github-script@v7
        with:
          script: |
            const keep = new Set(['main', 'backup/main-history-20261021']);
            const branches = await github.paginate(github.rest.repos.listBranches, {
              ...context.repo,
              per_page: 100
            });
            let count = 0;
            for (const branch of branches) {
              if (keep.has(branch.name) || branch.protected) {
                core.info('KEEP ' + branch.name);
                continue;
              }
              await github.rest.git.deleteRef({
                ...context.repo,
                ref: 'heads/' + branch.name
              });
              count++;
              core.info('DELETE ' + branch.name);
            }
            core.info('Deleted old branches: ' + count);
