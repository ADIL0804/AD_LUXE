<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#702c43">
<meta name="description" content="Gestion de stock, ventes et dépenses AD_LUXE.">
<title>AD_LUXE — Gestion boutique</title>
<style>
:root{--wine:#702c43;--wine-dark:#542033;--wine-soft:#f5e9ed;--ink:#271c20;--muted:#867980;--line:#ece5e8;--paper:#fff;--bg:#f8f6f5;--green:#267455;--red:#b24450;--amber:#9b681e;--shadow:0 12px 35px #3d17200d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.layout{min-height:100vh;display:grid;grid-template-columns:248px 1fr}.side{background:#fff;border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:24px}.brand{display:flex;align-items:center;gap:12px;padding:4px 8px}.monogram{width:42px;height:42px;background:var(--wine);color:#fff;border-radius:14px;display:grid;place-items:center;font-family:Georgia,serif;font-size:17px;letter-spacing:-1px}.brand strong{display:block;font-family:Georgia,serif;font-size:17px;letter-spacing:.5px}.brand small{color:var(--muted);font-size:12px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#75676d;text-align:left;padding:12px 13px;border-radius:11px;display:flex;align-items:center;gap:11px}.nav button.active,.nav button:hover{background:var(--wine-soft);color:var(--wine);font-weight:650}.nav .ico{width:20px;text-align:center;font-size:17px}.side-note{margin-top:auto;border:1px solid var(--line);border-radius:14px;padding:13px;color:var(--muted);font-size:12px}.side-note b{display:block;color:var(--wine);font-size:13px;margin-bottom:4px}.main{min-width:0}.top{height:75px;background:#ffffffcf;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;position:sticky;top:0;z-index:3}.top h1{font-size:20px;margin:0;font-weight:700}.topmeta{display:flex;align-items:center;gap:14px;color:var(--muted);font-size:13px}.avatar{width:34px;height:34px;border-radius:50%;background:var(--wine-soft);color:var(--wine);display:grid;place-items:center;font-weight:700}.content{max-width:1220px;margin:0 auto;padding:30px 34px 50px}.hello{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:23px;gap:12px}.hello h2{font-family:Georgia,serif;font-size:28px;font-weight:500;margin:0 0 3px}.hello p{margin:0;color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card,.panel{background:var(--paper);border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow)}.stat{padding:17px}.stat-head{color:var(--muted);font-size:13px;display:flex;align-items:center;justify-content:space-between;gap:8px}.stat-icon{height:32px;width:32px;border-radius:10px;background:var(--wine-soft);color:var(--wine);display:grid;place-items:center}.stat-value{font-size:24px;font-weight:720;letter-spacing:-.5px;margin-top:13px}.stat-foot{font-size:12px;color:var(--muted);margin-top:3px}.stat-foot.good{color:var(--green)}.stat-foot.bad{color:var(--red)}.grid2{display:grid;grid-template-columns:1.25fr .75fr;gap:15px;margin-top:16px}.panel{padding:20px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.panel-head h3{font-size:16px;margin:0}.panel-head p{font-size:12px;color:var(--muted);margin:3px 0 0}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:9px 13px;font-weight:620;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:7px}.btn:hover{border-color:#d9c3cb}.btn.primary{background:var(--wine);color:white;border-color:var(--wine)}.btn.primary:hover{background:var(--wine-dark)}.btn.soft{background:var(--wine-soft);color:var(--wine);border-color:transparent}.btn.danger{color:var(--red)}.btn.small{padding:6px 9px;font-size:12px}.btnrow{display:flex;gap:8px;flex-wrap:wrap}.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}.quick .btn{justify-content:flex-start;padding:13px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:#9a8e93;font-weight:650;padding:10px 11px;border-bottom:1px solid var(--line)}td{padding:12px 11px;border-bottom:1px solid #f2edef;font-size:13px}tbody tr:last-child td{border-bottom:0}.product-name{font-weight:650}.sub{display:block;color:var(--muted);font-size:12px;margin-top:2px}.pill{display:inline-flex;align-items:center;border-radius:999px;padding:4px 8px;background:#f4f1f2;color:#75676d;font-size:11px;font-weight:650}.pill.low{background:#fbf0dc;color:var(--amber)}.pill.ok{background:#e8f4ee;color:var(--green)}.empty{text-align:center;color:var(--muted);padding:28px 14px;font-size:13px}.empty b{display:block;color:var(--ink);margin-bottom:5px}.page-toolbar{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap}.page-toolbar h2{font-size:21px;margin:0}.search{border:1px solid var(--line);border-radius:10px;background:white;padding:9px 12px;min-width:220px;outline:none}.search:focus,input:focus,select:focus{border-color:#b1768b;box-shadow:0 0 0 3px #702c4312;outline:none}.filters{display:flex;gap:8px;flex-wrap:wrap}.filters select{min-width:140px}.form-control{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 11px;background:#fff;color:var(--ink)}label{display:grid;gap:6px;font-size:12px;color:#6f6268;font-weight:650}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.formgrid .full{grid-column:1/-1}.hint{font-weight:400;font-size:11px;color:#9a8e93}.modal-back{position:fixed;inset:0;background:#1f1419a6;display:none;align-items:center;justify-content:center;padding:16px;z-index:10}.modal-back.open{display:flex}.modal{background:#fff;width:min(520px,100%);max-height:90vh;overflow:auto;border-radius:20px;padding:22px;box-shadow:0 24px 80px #0003}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modal-head h3{margin:0;font-size:18px}.close{border:0;background:#f5f1f2;border-radius:9px;width:34px;height:34px;font-size:18px;color:var(--muted)}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.hidden{display:none!important}.notice{background:#f8f2f4;color:#725461;border-radius:12px;padding:12px 14px;font-size:12px;margin-top:14px}.reportgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.reportbox{background:#fbf9f9;border:1px solid var(--line);padding:15px;border-radius:13px}.reportbox small{color:var(--muted)}.reportbox strong{display:block;font-size:20px;margin-top:7px}.monthbar{height:10px;background:#f2eaed;border-radius:99px;overflow:hidden;margin-top:11px}.monthbar span{display:block;height:100%;background:var(--wine);border-radius:99px}.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,15px);opacity:0;pointer-events:none;background:#26191e;color:white;border-radius:11px;padding:11px 16px;font-size:13px;z-index:30;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}.mobilebar{display:none}.danger-zone{border:1px solid #eed8dc;background:#fff9fa;padding:15px;border-radius:14px}.fileinput{display:none}.cashresult{padding:12px;border-radius:11px;background:#f8f2f4;color:var(--wine);font-weight:700;margin-top:10px}
@media(max-width:920px){.layout{grid-template-columns:205px 1fr}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.content{padding:24px}.top{padding:0 24px}.grid2{grid-template-columns:1fr}}
@media(max-width:640px){body{font-size:14px}.layout{display:block;padding-bottom:75px}.side{display:none}.top{height:62px;padding:0 17px}.top h1{font-size:17px}.topmeta{font-size:0;gap:9px}.content{padding:21px 15px 28px}.hello{align-items:flex-start;flex-direction:column}.hello h2{font-size:25px}.cards{gap:9px}.stat{padding:13px;border-radius:14px}.stat-value{font-size:20px;margin-top:10px}.stat-head{font-size:11px}.stat-icon{width:28px;height:28px}.panel{padding:15px;border-radius:14px}.grid2{gap:11px;margin-top:11px}.quick{grid-template-columns:1fr 1fr}.quick .btn{font-size:12px;padding:11px 8px}.page-toolbar{align-items:flex-start}.page-toolbar>div:first-child{width:100%}.search{min-width:0;width:100%}.filters{width:100%}.filters select{flex:1;min-width:120px}.reportgrid{grid-template-columns:1fr 1fr}.mobilebar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;padding:7px 4px calc(7px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line);z-index:5}.mobilebar button{background:transparent;border:0;color:#887a80;font-size:10px;display:grid;justify-items:center;gap:3px;padding:4px 0}.mobilebar button span{font-size:17px}.mobilebar button.active{color:var(--wine);font-weight:700}.formgrid{grid-template-columns:1fr}.formgrid .full{grid-column:auto}.topmeta .today{display:none}.modal{padding:18px}.modal-back{align-items:flex-end;padding:0}.modal{border-radius:20px 20px 0 0;max-height:92vh;width:100%}}
</style>
</head>
<body>
<div class="layout"><aside class="side"><div class="brand"><div class="monogram">AD</div><div><strong>AD_LUXE</strong><small>Gestion boutique</small></div></div><nav class="nav" id="sidenav"><button data-page="home" class="active"><span class="ico">⌂</span>Tableau de bord</button><button data-page="stock"><span class="ico">▦</span>Stock & produits</button><button data-page="sales"><span class="ico">＋</span>Ventes</button><button data-page="expenses"><span class="ico">↘</span>Dépenses</button><button data-page="reports"><span class="ico">▤</span>Bilan</button><button data-page="settings"><span class="ico">⚙</span>Réglages & sauvegarde</button></nav><div class="side-note"><b>Vos données restent ici</b>Enregistrées dans le navigateur de cet appareil. Exportez une sauvegarde régulièrement.</div></aside>
<main class="main"><header class="top"><h1 id="topTitle">Tableau de bord</h1><div class="topmeta"><span class="today" id="todayLabel"></span><div class="avatar">AD</div></div></header><div class="content" id="view"></div></main></div>
<nav class="mobilebar" id="mobilebar"><button data-page="home" class="active"><span>⌂</span>Accueil</button><button data-page="stock"><span>▦</span>Stock</button><button data-page="sales"><span>＋</span>Ventes</button><button data-page="expenses"><span>↘</span>Frais</button><button data-page="reports"><span>▤</span>Bilan</button></nav>
<div class="modal-back" id="modalBack" role="dialog" aria-modal="true"><div class="modal"><div class="modal-head"><h3 id="modalTitle"></h3><button class="close" id="modalClose" aria-label="Fermer">×</button></div><div id="modalBody"></div></div></div><div class="toast" id="toast"></div>
<script>
(()=>{
const KEY='adluxe-gestion-v1';let db=load();let page='home';const view=document.getElementById('view');const titles={home:'Tableau de bord',stock:'Stock & produits',sales:'Ventes',expenses:'Dépenses',reports:'Bilan',settings:'Réglages & sauvegarde'};
function fresh(){return{products:[],sales:[],expenses:[],purchases:[],returns:[],cash:null}}
function load(){try{return Object.assign(fresh(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch{return fresh()}}
function persist(){localStorage.setItem(KEY,JSON.stringify(db));render()}
function id(){return crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)}
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(n){return new Intl.NumberFormat('fr-MA',{style:'currency',currency:'MAD',maximumFractionDigits:2}).format(Number(n)||0)}
function dateKey(d=new Date()){let x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`}
function dateText(v){if(!v)return '—';return new Intl.DateTimeFormat('fr-MA',{day:'2-digit',month:'short',year:'numeric'}).format(new Date(v+'T12:00:00'))}
function monthKey(d=new Date()){return dateKey(d).slice(0,7)}
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2300)}
function sum(xs,fn){return xs.reduce((a,x)=>a+fn(x),0)}
function currentSales(){return db.sales.filter(x=>x.date===dateKey())}function currentExpenses(){return db.expenses.filter(x=>x.date===dateKey())}function currentPurchases(){return db.purchases.filter(x=>x.date===dateKey())}function currentReturns(){return (db.returns||[]).filter(x=>x.date===dateKey())}
function returnedQty(s){return sum((db.returns||[]).filter(x=>x.saleId===s.id),x=>Number(x.qty)||0)}function returnTotal(s){return sum((db.returns||[]).filter(x=>x.saleId===s.id),x=>Number(x.total)||0)}function netSaleTotal(s){return Number(s.total||0)-returnTotal(s)}
function cogs(s){return Number(s.cost||0)*Number(s.qty||0)}
function setPage(p){page=p;document.getElementById('topTitle').textContent=titles[p]||titles.home;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
function empty(msg,sub){return `<div class="empty"><b>${esc(msg)}</b>${esc(sub||'')}</div>`}
function stat(label,value,icon,foot='',tone=''){return `<div class="card stat"><div class="stat-head">${label}<span class="stat-icon">${icon}</span></div><div class="stat-value">${value}</div><div class="stat-foot ${tone}">${foot}</div></div>`}
function pageHome(){const sales=currentSales(),exp=currentExpenses(),buy=currentPurchases(),returns=currentReturns(),rev=sum(sales,x=>x.total)-sum(returns,x=>x.total),gross=rev-(sum(sales,cogs)-sum(returns,x=>x.qty*x.cost)),spend=sum(exp,x=>x.amount)+sum(buy,x=>x.total)+sum(returns,x=>x.total),net=gross-sum(exp,x=>x.amount),pieces=sum(db.products,x=>Number(x.stock)||0),low=db.products.filter(x=>Number(x.stock)<=Number(x.alert||0));const recent=[...db.sales.map(x=>({...x,kind:'Vente'})),...db.expenses.map(x=>({...x,kind:'Dépense'})),...(db.returns||[]).map(x=>({...x,kind:'Retour'}))].sort((a,b)=>(b.created||'').localeCompare(a.created||'')).slice(0,6);
return `<div class="hello"><div><h2>Salam 👋</h2><p>Voici le résumé de ta boutique pour aujourd’hui.</p></div><button class="btn primary" onclick="openSale()">＋ Enregistrer une vente</button></div><div class="cards">${stat('Ventes du jour',money(rev),'↗',`${sales.length} opération${sales.length===1?'':'s'}`)}${stat('Bénéfice estimé',money(net),'◆','Ventes − coût articles − dépenses',net>=0?'good':'bad')}${stat('Articles en stock',pieces,'▦',`${db.products.length} variantes couleur / taille`)}${stat('Sorties du jour',money(spend),'↘','Achats de stock et dépenses')}</div><div class="grid2"><section class="panel"><div class="panel-head"><div><h3>Stock à surveiller</h3><p>Articles au seuil ou en rupture</p></div><button class="btn small" onclick="setPage('stock')">Voir le stock</button></div>${low.length?`<div class="table-wrap"><table><thead><tr><th>Article</th><th>Variante</th><th>Reste</th><th></th></tr></thead><tbody>${low.slice(0,5).map(p=>`<tr><td class="product-name">${esc(p.name)}</td><td>${esc([p.color,p.size].filter(Boolean).join(' · ')||'—')}</td><td><span class="pill low">${p.stock} restant${p.stock==1?'':'s'}</span></td><td><button class="btn small soft" onclick="openRestock('${p.id}')">Réappro.</button></td></tr>`).join('')}</tbody></table></div>`:empty('Aucune alerte de stock','Ajoute tes articles pour suivre les quantités.')}</section><section class="panel"><div class="panel-head"><div><h3>Actions rapides</h3><p>Tenir la caisse à jour</p></div></div><div class="quick"><button class="btn" onclick="openProduct()">＋ Ajouter un article</button><button class="btn" onclick="openRestock()">↥ Entrée de stock</button><button class="btn" onclick="openExpense()">↘ Ajouter une dépense</button><button class="btn" onclick="setPage('reports')">▤ Voir le bilan</button></div><div class="notice">Le bénéfice affiché est une estimation basée sur le prix d’achat saisi pour chaque article.</div></section></div><section class="panel" style="margin-top:15px"><div class="panel-head"><div><h3>Activité récente</h3><p>Dernières ventes et dépenses</p></div><button class="btn small" onclick="setPage('sales')">Historique</button></div>${recent.length?`<div class="table-wrap"><table><thead><tr><th>Type</th><th>Détail</th><th>Date</th><th>Montant</th></tr></thead><tbody>${recent.map(x=>`<tr><td><span class="pill ${x.kind==='Vente'?'ok':''}">${x.kind}</span></td><td class="product-name">${esc(x.name||x.note||'Opération')}</td><td>${dateText(x.date)}</td><td>${x.kind==='Dépense'||x.kind==='Retour'?'- ':''}${money(x.total||x.amount)}</td></tr>`).join('')}</tbody></table></div>`:empty('Pas encore d’opération','Enregistre une vente ou une dépense pour commencer.')}</section>`}
function pageStock(){const q=(document.getElementById('stockSearch')?.value||'').toLowerCase();let list=db.products.filter(p=>`${p.name} ${p.color} ${p.size} ${p.category}`.toLowerCase().includes(q));return `<div class="page-toolbar"><div><h2>Stock & produits</h2><div class="sub">Chaque ligne représente une combinaison d’article, couleur et taille.</div></div><div class="btnrow"><input id="stockSearch" class="search" placeholder="Rechercher un article…" value="${esc(q)}" oninput="refreshStock()"><button class="btn" onclick="openRestock()">↥ Entrée stock</button><button class="btn primary" onclick="openProduct()">＋ Nouvel article</button></div></div><section class="panel"><div class="table-wrap">${list.length?`<table><thead><tr><th>Article</th><th>Couleur / taille</th><th>Prix achat</th><th>Prix vente</th><th>Quantité</th><th>Valeur achat</th><th>Action</th></tr></thead><tbody>${list.map(p=>`<tr><td><span class="product-name">${esc(p.name)}</span><span class="sub">${esc(p.category||'Sans catégorie')}</span></td><td>${esc([p.color,p.size].filter(Boolean).join(' · ')||'—')}</td><td>${money(p.cost)}</td><td>${money(p.price)}</td><td><span class="pill ${p.stock<=p.alert?'low':'ok'}">${p.stock}</span></td><td>${money(p.stock*p.cost)}</td><td><div class="btnrow"><button class="btn small soft" onclick="openSale('${p.id}')">Vendre</button><button class="btn small" onclick="openRestock('${p.id}')">＋ Stock</button><button class="btn small" onclick="editProduct('${p.id}')">Modifier</button></div></td></tr>`).join('')}</tbody></table>`:empty(db.products.length?'Aucun résultat':'Ton stock est encore vide',db.products.length?'Essaie une autre recherche.':'Ajoute ton premier article et ses tailles/couleurs.')}</div></section><section class="panel" style="margin-top:15px"><div class="panel-head"><div><h3>Entrées de stock récentes</h3><p>Corrige une réception si tu t’es trompé dans la quantité ou le coût.</p></div></div><div class="table-wrap">${db.purchases.length?`<table><thead><tr><th>Date</th><th>Article</th><th>Quantité</th><th>Coût unitaire</th><th>Total</th><th>Action</th></tr></thead><tbody>${[...db.purchases].sort((a,b)=>(b.created||'').localeCompare(a.created||'')).map(x=>`<tr><td>${dateText(x.date)}</td><td>${esc(x.name)} <span class="sub">${esc([x.color,x.size].filter(Boolean).join(' · '))}</span></td><td>${x.qty}</td><td>${money(x.cost)}</td><td>${money(x.total)}</td><td><button class="btn small" onclick="editPurchase('${x.id}')">Modifier</button></td></tr>`).join('')}</tbody></table>`:empty('Aucune entrée de stock','Les réceptions apparaîtront ici.')}</div></section><div class="notice">Conseil : saisis les articles séparément par taille et couleur pour savoir exactement ce qu’il reste en stock.</div>`}
function refreshStock(){const y=window.scrollY;view.innerHTML=pageStock();document.getElementById('stockSearch')?.focus();const el=document.getElementById('stockSearch');if(el){el.setSelectionRange(el.value.length,el.value.length)}window.scrollTo(0,y)}
function pageSales(){const rows=[...db.sales].sort((a,b)=>(b.created||'').localeCompare(a.created||''));return `<div class="page-toolbar"><div><h2>Ventes</h2><div class="sub">Historique des encaissements et bénéfice estimé.</div></div><button class="btn primary" onclick="openSale()">＋ Enregistrer une vente</button></div><section class="panel"><div class="table-wrap">${rows.length?`<table><thead><tr><th>Date</th><th>Article</th><th>Quantité</th><th>Paiement</th><th>Montant</th><th>Bénéfice brut</th><th>Actions</th></tr></thead><tbody>${rows.map(s=>`<tr><td>${dateText(s.date)}</td><td class="product-name">${esc(s.name)}<span class="sub">${esc([s.color,s.size].filter(Boolean).join(' · '))}</span></td><td>${s.qty}</td><td><span class="pill">${esc(s.method)}</span></td><td>${money(netSaleTotal(s))}</td><td>${money(netSaleTotal(s)-(cogs(s)-returnedQty(s)*Number(s.cost||0)))}</td><td><button class="btn small" onclick="editSale('${s.id}')">Modifier</button> <button class="btn small soft" onclick="openReturn('${s.id}')">Retour</button></td></tr>`).join('')}</tbody></table>`:empty('Aucune vente enregistrée','Les ventes que tu ajoutes apparaîtront ici.')}</div></section>`}
function pageExpenses(){const rows=[...db.expenses].sort((a,b)=>(b.created||'').localeCompare(a.created||''));return `<div class="page-toolbar"><div><h2>Dépenses</h2><div class="sub">Loyer, livraison, emballages et autres frais.</div></div><button class="btn primary" onclick="openExpense()">＋ Ajouter une dépense</button></div><section class="panel"><div class="table-wrap">${rows.length?`<table><thead><tr><th>Date</th><th>Catégorie</th><th>Détail</th><th>Paiement</th><th>Montant</th><th>Action</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${dateText(x.date)}</td><td><span class="pill">${esc(x.category)}</span></td><td>${esc(x.note||'—')}</td><td>${esc(x.method)}</td><td>− ${money(x.amount)}</td><td><button class="btn small" onclick="editExpense('${x.id}')">Modifier</button></td></tr>`).join('')}</tbody></table>`:empty('Aucune dépense enregistrée','Ajoute les frais de la boutique pour calculer le résultat net.')}</div></section>`}
function pageReports(){const m=monthKey(),ss=db.sales.filter(x=>x.date?.startsWith(m)),ee=db.expenses.filter(x=>x.date?.startsWith(m)),pp=db.purchases.filter(x=>x.date?.startsWith(m)),rr=(db.returns||[]).filter(x=>x.date?.startsWith(m)),rev=sum(ss,x=>x.total)-sum(rr,x=>x.total),gross=rev-(sum(ss,cogs)-sum(rr,x=>x.qty*x.cost)),ex=sum(ee,x=>x.amount),purchases=sum(pp,x=>x.total),net=gross-ex,stockValue=sum(db.products,x=>x.stock*x.cost), cashSales=sum(ss.filter(x=>x.method==='Espèces'),x=>x.total),cashReturns=sum(rr.filter(x=>x.method==='Espèces'),x=>x.total),cashExp=sum(ee.filter(x=>x.method==='Espèces'),x=>x.amount),cashPurch=sum(pp.filter(x=>x.method==='Espèces'),x=>x.total);
return `<div class="page-toolbar"><div><h2>Bilan du mois</h2><div class="sub">Résumé de ${new Intl.DateTimeFormat('fr-MA',{month:'long',year:'numeric'}).format(new Date())}.</div></div><div class="btnrow"><button class="btn" onclick="exportCSV()">↓ Exporter les ventes CSV</button><button class="btn primary" onclick="setPage('settings')">Sauvegarder mes données</button></div></div><div class="reportgrid"><div class="reportbox"><small>Chiffre d’affaires</small><strong>${money(rev)}</strong><div class="sub">${ss.length} ventes enregistrées</div></div><div class="reportbox"><small>Bénéfice brut estimé</small><strong>${money(gross)}</strong><div class="sub">Ventes moins coût d’achat vendu</div></div><div class="reportbox"><small>Résultat après dépenses</small><strong>${money(net)}</strong><div class="sub">Hors impôts et autres charges non saisies</div></div><div class="reportbox"><small>Dépenses du mois</small><strong>${money(ex)}</strong><div class="sub">${ee.length} dépenses saisies</div></div><div class="reportbox"><small>Achats de stock</small><strong>${money(purchases)}</strong><div class="sub">${pp.reduce((a,x)=>a+x.qty,0)} pièces réceptionnées</div></div><div class="reportbox"><small>Valeur d’achat du stock actuel</small><strong>${money(stockValue)}</strong><div class="sub">Basée sur le coût unitaire enregistré</div></div></div><section class="panel" style="margin-top:15px"><div class="panel-head"><div><h3>Suivi de la caisse espèces</h3><p>Calcul indicatif basé sur les paiements saisis comme espèces.</p></div><button class="btn small" onclick="openCash()">Définir fond de caisse</button></div><div class="reportgrid"><div class="reportbox"><small>Fond de caisse de départ</small><strong>${db.cash?.date===m?money(db.cash.opening):'Non défini'}</strong></div><div class="reportbox"><small>Espèces reçues − sorties espèces</small><strong>${money(cashSales-cashReturns-cashExp-cashPurch)}</strong></div><div class="reportbox"><small>Caisse théorique</small><strong>${money((db.cash?.date===m?Number(db.cash.opening):0)+cashSales-cashReturns-cashExp-cashPurch)}</strong></div></div><div class="notice">Ce bilan aide au suivi quotidien. Il ne remplace pas les déclarations ou la comptabilité fiscale d’un comptable.</div></section>`}
function pageSettings(){return `<div class="page-toolbar"><div><h2>Réglages & sauvegarde</h2><div class="sub">Protège tes informations et garde-en une copie.</div></div></div><div class="grid2"><section class="panel"><div class="panel-head"><div><h3>Sauvegarder ou restaurer</h3><p>Garde une copie JSON sur ton téléphone ou iCloud Drive.</p></div></div><div class="btnrow"><button class="btn primary" onclick="backup()">↓ Télécharger ma sauvegarde</button><label class="btn" style="cursor:pointer">↑ Restaurer une sauvegarde<input id="restoreFile" class="fileinput" type="file" accept="application/json" onchange="restore(event)"></label></div><div class="notice">Si tu changes de téléphone ou effaces les données du navigateur, restaure d’abord ta dernière sauvegarde.</div></section><section class="panel"><div class="panel-head"><div><h3>Confidentialité</h3></div></div><p class="sub" style="font-size:14px;line-height:1.7">Les articles, ventes et dépenses sont enregistrés dans la mémoire du navigateur sur cet appareil. Ils ne sont pas synchronisés avec un compte. Pense à exporter une sauvegarde régulièrement.</p></section></div><section class="panel" style="margin-top:15px"><div class="panel-head"><div><h3>Départ à zéro</h3><p>Supprimer toutes les données enregistrées sur cet appareil.</p></div></div><div class="danger-zone"><button class="btn danger" onclick="clearAll()">Effacer les données de la boutique</button></div></section>`}
function render(){const f={home:pageHome,stock:pageStock,sales:pageSales,expenses:pageExpenses,reports:pageReports,settings:pageSettings};view.innerHTML=(f[page]||pageHome)();document.getElementById('todayLabel').textContent=new Intl.DateTimeFormat('fr-MA',{weekday:'short',day:'numeric',month:'short'}).format(new Date())}
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));
function openModal(title,html,onSubmit){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=html;document.getElementById('modalBack').classList.add('open');document.getElementById('modalBody').querySelector('form')?.addEventListener('submit',e=>{e.preventDefault();onSubmit(new FormData(e.currentTarget),e.currentTarget)});setTimeout(()=>document.querySelector('#modalBody input:not([type=hidden]),#modalBody select')?.focus(),80)}
function closeModal(){document.getElementById('modalBack').classList.remove('open')}document.getElementById('modalClose').onclick=closeModal;document.getElementById('modalBack').addEventListener('click',e=>{if(e.target.id==='modalBack')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
window.openProduct=()=>openModal('Ajouter un article',`<form><div class="formgrid"><label class="full">Nom de l’article<input class="form-control" name="name" placeholder="Ex. Ensemble Scarf" required></label><label>Catégorie<input class="form-control" name="category" placeholder="Ensemble, jean…"></label><label>Couleur<input class="form-control" name="color" placeholder="Bordeaux"></label><label>Taille<input class="form-control" name="size" placeholder="S, M, L, XL"></label><label>Quantité initiale<input class="form-control" name="stock" type="number" min="0" step="1" value="0" required></label><label>Prix d’achat (DH)<input class="form-control" name="cost" type="number" min="0" step="0.01" required></label><label>Prix de vente (DH)<input class="form-control" name="price" type="number" min="0" step="0.01" required></label><label>Seuil d’alerte stock<input class="form-control" name="alert" type="number" min="0" value="2"></label><div class="full hint">Crée une ligne par taille et couleur pour un suivi précis.</div></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Annuler</button><button class="btn primary">Enregistrer</button></div></form>`,f=>{const p=Object.fromEntries(f);p.id=id();p.stock=Number(p.stock);p.alert=Number(p.alert);p.cost=Number(p.cost);p.price=Number(p.price);if(db.products.some(x=>x.name.toLowerCase()===p.name.toLowerCase()&&x.color.toLowerCase()===p.color.toLowerCase()&&x.size.toLowerCase()===p.size.toLowerCase())){toast('Cette variante existe déjà.');return}db.products.push(p);persist();closeModal();toast('Article ajouté au stock.')});
window.openRestock=(productId='')=>{const opts=db.products.map(p=>`<option value="${p.id}" ${p.id===productId?'selected':''}>${esc(p.name)} — ${esc([p.color,p.size].filter(Boolean).join(' / ')||'standard')} (${p.stock} en stock)</option>`).join('');if(!opts){toast('Ajoute d’abord un article.');if(page!=='stock')setPage('stock');return}openModal('Entrée de stock',`<form><div class="formgrid"><label class="full">Article / variante<select class="form-control" name="product" required>${opts}</select></label><label>Quantité reçue<input class="form-control" name="qty" type="number" min="1" step="1" required></label><label>Coût unitaire (DH)<input class="form-control" name="cost" type="number" min="0" step="0.01" required></label><label class="full">Paiement<select class="form-control" name="method"><option>Espèces</option><option>Carte</option><option>Virement</option><option>Crédit fournisseur</option></select></label><div class="full hint">Le montant d’achat est calculé automatiquement et ajouté au suivi des sorties.</div></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Annuler</button><button class="btn primary">Confirmer la réception</button></div></form>`,f=>{const p=db.products.find(x=>x.id===f.get('product'));const qty=Number(f.get('qty')),cost=Number(f.get('cost'));if(!p||qty<1)return;const oldQty=Number(p.stock)||0,oldCost=Number(p.cost)||0;p.cost=(oldQty*oldCost+qty*cost)/(oldQty+qty);p.stock+=qty;db.purchases.push({id:id(),product:p.id,name:p.name,color:p.color,size:p.size,qty,cost,total:qty*cost,method:f.get('method'),date:dateKey(),created:new Date().toISOString()});persist();closeModal();toast('Stock mis à jour.')})};
window.openSale=(productId='')=>{const opts=db.products.filter(p=>p.stock>0).map(p=>`<option value="${p.id}" data-price="${p.price}" data-stock="${p.stock}" ${p.id===productId?'selected':''}>${esc(p.name)} — ${esc([p.color,p.size].filter(Boolean).join(' / ')||'standard')} · ${p.stock} en stock · ${money(p.price)}</option>`).join('');if(!opts){toast('Aucun article disponible à vendre.');return}openModal('Enregistrer une vente',`<form><div class="formgrid"><label class="full">Article<select class="form-control" name="product" id="saleProduct" required>${opts}</select></label><label>Quantité<input class="form-control" name="qty" type="number" min="1" value="1" required></label><label>Prix de vente unitaire (DH)<input class="form-control" name="price" id="salePrice" type="number" min="0" step="0.01" required></label><label class="full">Mode de paiement<select class="form-control" name="method"><option>Espèces</option><option>Carte</option><option>Virement</option><option>COD</option></select></label><label class="full">Nom client <span class="hint">(facultatif)</span><input class="form-control" name="customer" placeholder=""></label></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Annuler</button><button class="btn primary">Valider la vente</button></div></form>`,f=>{const p=db.products.find(x=>x.id===f.get('product'));const qty=Number(f.get('qty')),price=Number(f.get('price'));if(!p||qty<1||qty>p.stock){toast('Vérifie la quantité disponible.');return}db.sales.push({id:id(),product:p.id,name:p.name,color:p.color,size:p.size,qty,price,cost:p.cost,total:qty*price,method:f.get('method'),customer:f.get('customer'),date:dateKey(),created:new Date().toISOString()});p.stock-=qty;persist();closeModal();toast('Vente enregistrée.')});const sync=()=>{const sel=document.getElementById('saleProduct');const opt=sel.options[sel.selectedIndex];document.getElementById('salePrice').value=opt.dataset.price};document.getElementById('saleProduct').addEventListener('change',sync);sync()};
window.editProduct=(pid)=>{const p=db.products.find(x=>x.id===pid);if(!p)return;const html='<form><div class="formgrid"><label class="full">Nom<input class="form-control" name="name" value="'+esc(p.name)+'" required></label><label>Catégorie<input class="form-control" name="category" value="'+esc(p.category||'')+'"></label><label>Couleur<input class="form-control" name="color" value="'+esc(p.color||'')+'"></label><label>Taille<input class="form-control" name="size" value="'+esc(p.size||'')+'"></label><label>Stock<input class="form-control" name="stock" type="number" min="0" value="'+p.stock+'" required></label><label>Prix achat<input class="form-control" name="cost" type="number" min="0" step=".01" value="'+p.cost+'" required></label><label>Prix vente<input class="form-control" name="price" type="number" min="0" step=".01" value="'+p.price+'" required></label><label>Seuil alerte<input class="form-control" name="alert" type="number" min="0" value="'+(p.alert||0)+'"></label></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Annuler</button><button class="btn primary">Enregistrer</button></div></form>';openModal('Modifier article',html,f=>{const v=Object.fromEntries(f);Object.assign(p,{name:v.name,category:v.category,color:v.color,size:v.size,stock:Number(v.stock),cost:Number(v.cost),price:Number(v.price),alert:Number(v.alert)});persist();closeModal();toast('Article et stock modifiés.')})};
window.editPurchase=(id)=>{const x=db.purchases.find(y=>y.id===id),p=x&&db.products.find(y=>y.id===x.product);if(!x||!p)return;const html='<form><div class="formgrid"><label>Quantité reçue<input class="form-control" name="qty" type="number" min="1" value="'+x.qty+'" required></label><label>Coût unitaire<input class="form-control" name="cost" type="number" min="0" step=".01" value="'+x.cost+'" required></label></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Annuler</button><button class="btn primary">Enregistrer</button></div></form>';openModal('Modifier entrée stock',html,f=>{const qty=Number(f.get('qty')),cost=Number(f.get('cost')),delta=qty-x.qty;if(p.stock+delta<0){toast('Stock actuel insuffisant pour diminuer cette réception.');return}p.stock+=delta;p.cost=cost;x.qty=qty;x.cost=cost;x.total=qty*cost;persist();closeModal();toast('Entrée stock et quantité modifiées.')})};
window.editSale=(id)=>{const s=db.sales.find(x=>x.id===id);if(!s)return;if(returnedQty(s)){toast('Cette vente a un retour; garde son historique tel quel.');return}const old=db.products.find(x=>x.id===s.product);if(!old)return;const opts=db.products.map(p=>'<option value="'+p.id+'" '+(p.id===s.product?'selected':'')+'>'+esc(p.name)+' — '+esc([p.color,p.size].filter(Boolean).join(' / '))+' (stock '+(p.stock+(p.id===old.id?s.qty:0))+')</option>').join('');const html='<form><div class="formgrid"><label class="full">Article<select class="form-control" name="product">'+opts+'</select></label><label>Quantité<input class="form-control" name="qty" type="number" min="1" value="'+s.qty+'" required></label><label>Prix unitaire<input class="form-control" name="price" type="number" min="0" step=".01" value="'+s.price+'" required></label><label>Paiement<select class="form-control" name="method">'+['Espèces','Carte','Virement','COD'].map(x=>'<option '+(s.method===x?'selected':'')+'>'+x+'</option>').join('')+'</select></label><label>Client<input class="form-control" name="customer" value="'+esc(s.customer||'')+'"></label></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Annuler</button><button class="btn primary">Enregistrer</button></div></form>';openModal('Modifier vente',html,f=>{const n=db.products.find(x=>x.id===f.get('product')),q=Number(f.get('qty')),price=Number(f.get('price'));if(!n||q<1)return;if(n===old){if(q>n.stock+s.qty){toast('Stock insuffisant.');return}n.stock+=s.qty-q}else{if(q>n.stock){toast('Stock insuffisant.');return}old.stock+=s.qty;n.stock-=q}Object.assign(s,{product:n.id,name:n.name,color:n.color,size:n.size,qty:q,price,cost:n.cost,total:q*price,method:f.get('method'),customer:f.get('customer')});persist();closeModal();toast('Vente modifiée et stock recalculé.')})};
window.openReturn=(saleId)=>{const s=db.sales.find(x=>x.id===saleId);if(!s)return;const left=s.qty-returnedQty(s);if(!left){toast('Retour déjà complet.');return}const html='<form><div class="notice">'+esc(s.name)+' — reste '+left+' pièce(s) à retourner.</div><div class="formgrid"><label>Quantité<input class="form-control" name="qty" type="number" min="1" max="'+left+'" value="1" required></label><label>Mode remboursement<select class="form-control" name="method"><option>Espèces</option><option>Carte</option><option>Virement</option><option>COD</option></select></label><label class="full">Motif<input class="form-control" name="reason"></label></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Annuler</button><button class="btn primary">Confirmer retour</button></div></form>';openModal('Retour client',html,f=>{const q=Number(f.get('qty'));if(q<1||q>s.qty-returnedQty(s)){toast('Quantité invalide.');return}const p=db.products.find(x=>x.id===s.product);if(!p)return;p.stock+=q;db.returns.push({id:id(),saleId:s.id,product:s.product,name:s.name,color:s.color,size:s.size,qty:q,price:s.price,cost:s.cost,total:q*s.price,method:f.get('method'),reason:f.get('reason'),date:dateKey(),created:new Date().toISOString()});persist();closeModal();toast('Retour ajouté au stock et remboursement enregistré.')})};
window.editExpense=(id)=>{const e=db.expenses.find(x=>x.id===id);if(!e)return;const html='<form><div class="formgrid"><label>Catégorie<input class="form-control" name="category" value="'+esc(e.category)+'"></label><label>Montant<input class="form-control" name="amount" type="number" min="0" step=".01" value="'+e.amount+'" required></label><label class="full">Détail<input class="form-control" name="note" value="'+esc(e.note||'')+'"></label><label>Paiement<input class="form-control" name="method" value="'+esc(e.method||'')+'"></label></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Annuler</button><button class="btn primary">Enregistrer</button></div></form>';openModal('Modifier dépense',html,f=>{Object.assign(e,{category:f.get('category'),amount:Number(f.get('amount')),note:f.get('note'),method:f.get('method')});persist();closeModal();toast('Dépense modifiée.')})};
window.openExpense=()=>openModal('Ajouter une dépense',`<form><div class="formgrid"><label>Catégorie<select class="form-control" name="category"><option>Loyer</option><option>Livraison</option><option>Emballage</option><option>Publicité</option><option>Transport</option><option>Électricité / eau</option><option>Autre</option></select></label><label>Montant (DH)<input class="form-control" name="amount" type="number" min="0.01" step="0.01" required></label><label class="full">Détail<input class="form-control" name="note" placeholder="Facultatif"></label><label class="full">Paiement<select class="form-control" name="method"><option>Espèces</option><option>Carte</option><option>Virement</option><option>Autre</option></select></label></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Annuler</button><button class="btn primary">Enregistrer</button></div></form>`,f=>{db.expenses.push({id:id(),category:f.get('category'),amount:Number(f.get('amount')),note:f.get('note'),method:f.get('method'),date:dateKey(),created:new Date().toISOString()});persist();closeModal();toast('Dépense enregistrée.')});
window.openCash=()=>openModal('Fond de caisse',`<form><div class="formgrid"><label class="full">Montant espèces au début du mois (DH)<input class="form-control" name="opening" type="number" min="0" step="0.01" value="${db.cash?.date===monthKey()?db.cash.opening:0}" required></label><div class="full hint">Le suivi de caisse affichera ce fond plus les ventes espèces moins les sorties espèces.</div></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Annuler</button><button class="btn primary">Enregistrer</button></div></form>`,f=>{db.cash={date:monthKey(),opening:Number(f.get('opening'))};persist();closeModal();toast('Fond de caisse enregistré.')});
window.backup=()=>{const blob=new Blob([JSON.stringify({format:'AD_LUXE_GESTION',version:1,exportedAt:new Date().toISOString(),data:db},null,2)],{type:'application/json'});download(blob,`ad-luxe-sauvegarde-${dateKey()}.json`);toast('Sauvegarde téléchargée.')};
window.restore=async e=>{const file=e.target.files?.[0];if(!file)return;try{const x=JSON.parse(await file.text()),d=x.data||x;if(!Array.isArray(d.products)||!Array.isArray(d.sales)||!Array.isArray(d.expenses))throw Error();if(!confirm('La restauration remplacera les données enregistrées sur cet appareil. Continuer ?'))return;db=Object.assign(fresh(),d);persist();toast('Sauvegarde restaurée.')}catch{alert('Ce fichier ne ressemble pas à une sauvegarde AD_LUXE valide.')}e.target.value=''};
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}
window.exportCSV=()=>{const rows=[['Date','Article','Couleur','Taille','Quantité','Prix unitaire DH','Montant DH','Paiement','Bénéfice brut DH'],...db.sales.map(s=>[s.date,s.name,s.color,s.size,s.qty,s.price,s.total,s.method,s.total-cogs(s)])];const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(';')).join('\n');download(new Blob([csv],{type:'text/csv;charset=utf-8'}),`ad-luxe-ventes-${dateKey()}.csv`)};
window.clearAll=()=>{if(confirm('Effacer tous les articles, ventes et dépenses de cet appareil ? Cette action ne peut pas être annulée.')){db=fresh();persist();toast('Données effacées.')}};
window.refreshStock=refreshStock;window.setPage=setPage;render();
})();
</script>
</body></html>
